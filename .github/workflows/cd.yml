on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.5"

      - run: ./scripts/buildprod.sh

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: "${{ secrets.GCP_CREDENTIALS }}"

      - uses: google-github-actions/setup-gcloud@v3

      - run:
          gcloud builds submit --tag us-central1-docker.pkg.dev/notely-503714/notely-ar-repo/notely:${{ github.sha }} \
          --tag us-central1-docker.pkg.dev/notely-503714/notely-ar-repo/notely:latest
